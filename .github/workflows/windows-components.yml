name: Windows components
run-name: Windows components · ${{ github.ref_name }}
# Builds the tools the Windows installer ships (Vulkan with shaderc, hactool, and the native code generator with Unicorn,
# all compiled with the LLVM-MinGW toolchain Qt pairs with its newest release) and packs them. Qt, FFmpeg and SDL3 are not
# built or redistributed: the installer downloads them from their publishers. This workflow runs that very setup
# (scripts/install/windows_setup.py) and the Windows tests against the result, so the combination is tested before a user
# gets it. Nothing is pinned in the repository: the resolved versions and SHA-256 values travel inside the archive (inputs/)
# and in windows-components.json. Weekly, so upstream changes show up before a user hits them.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tools as the release "windows-components"'
        type: boolean
        default: false
  push:
    branches: [main, win-integration]
    paths:  # everything the Windows build compiles, links or runs: runtime (renderer, Qt UI, Win32 entry), CPU headers, generator, recipes, setup
      - .github/workflows/windows-components.yml
      - scripts/recomp/runtime/**
      - scripts/recomp/rt/**
      - scripts/recomp/upstream/**
      - scripts/recomp/native-generator/**
      - scripts/recomp/*.py
      - scripts/recomp/hactool_windows.*
      - scripts/install/**
      - scripts/tests/test_windows*.py
      - scripts/tests/test_dependency_build.py
      - installer/assets/windows-*.json
      - installer/extract/**
      - shader_translator/**
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: windows-components-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}  # a newer push replaces an unfinished test run; schedule and publish runs finish
jobs:
  components:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve and download the newest build inputs
        run: |
          python scripts/recomp/resolve_inputs.py --out work/downloads
          Add-Content $env:GITHUB_ENV "BDSP_WINDOWS_CONTRACT=$PWD\work\resolved\windows-dependencies.json"
          Add-Content $env:GITHUB_ENV "BDSP_WINDOWS_SOURCES=$PWD\work\resolved\windows-sources.json"
      - name: Fetch the LLVM-MinGW toolchain Qt pairs with its newest release (and the Qt sources for the licence texts)
        run: |
          New-Item -ItemType Directory -Force work/tools | Out-Null
          python scripts/recomp/resolve_qt.py --out work/qt-download
          7z x work/qt-download/toolchain.7z -owork/qt-tools -y | Out-Null
          Copy-Item work/qt-download/source.tar.xz work/downloads/qtbase-src.tar.xz
          $clang = Get-ChildItem work/qt-tools -Recurse -Filter x86_64-w64-mingw32-clang.exe | Select-Object -First 1
          Move-Item $clang.Directory.Parent.FullName work/toolchain
          Copy-Item work/qt-download/qt.json work/resolved/qt.json
          python -m pip install --target work/pydeps Pillow lz4
      - name: Cache keys of the tools (each one from its own sources and the compiler version only)
        run: |
          python -c "import json; s=json.load(open('work/resolved/windows-sources.json'))['sources']; t=json.load(open('work/resolved/qt.json'))['toolchain_version']; k=lambda n, v: open('work/key-' + n + '.txt', 'w').write(v); k('vulkan', ' '.join(s[n]['revision'] for n in ('vulkan-headers', 'vma', 'shaderc', 'glslang', 'spirv-headers', 'spirv-tools')) + ' ' + t); k('hactool', s['hactool']['revision'] + ' ' + t); k('unicorn', 'unicorn-2.1.4 ' + t)"
          Get-Content work/key-*.txt
      - name: Reuse Unicorn while the version and compiler are unchanged
        id: unicorn-cache
        uses: actions/cache@v6
        with:
          path: work/unicorn
          key: unicorn-${{ hashFiles('work/key-unicorn.txt') }}
      - name: Build Unicorn from source with the same compiler (GPL-2.0; no Visual C++ runtime needed)
        if: steps.unicorn-cache.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest https://github.com/unicorn-engine/unicorn/archive/refs/tags/2.1.4.tar.gz -OutFile work/unicorn.tar.gz -UseBasicParsing
          tar xzf work/unicorn.tar.gz -C work
          $bin = ("$PWD\work\toolchain\bin").Replace("\", "/")
          $prefix = ("$PWD\work\unicorn").Replace("\", "/")
          $env:PATH = "$PWD\work\toolchain\bin;$env:PATH"
          cmake -S work/unicorn-2.1.4 -B work/unicorn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$bin/x86_64-w64-mingw32-clang.exe" -DCMAKE_CXX_COMPILER="$bin/x86_64-w64-mingw32-clang++.exe" -DCMAKE_RC_COMPILER="$bin/x86_64-w64-mingw32-windres.exe" -DBUILD_SHARED_LIBS=ON -DUNICORN_ARCH=aarch64 -DUNICORN_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build work/unicorn-build --parallel
          cmake --install work/unicorn-build
          Copy-Item work/unicorn/bin/libunicorn.dll work/unicorn/lib/
          $pthread = Get-ChildItem work/toolchain -Recurse -Filter libwinpthread-1.dll | Where-Object { $_.FullName -match 'x86_64' } | Select-Object -First 1
          if (-not $pthread) { throw 'libwinpthread-1.dll not found in the toolchain' }
          Copy-Item $pthread.FullName work/unicorn/lib/
      - name: Reuse the Vulkan/shaderc bundle while its sources, recipe and compiler are unchanged
        id: vulkan-cache
        uses: actions/cache@v6
        with:
          path: work/tools/vulkan
          key: vulkan-${{ hashFiles('work/key-vulkan.txt', 'scripts/recomp/dependency_build.py', 'scripts/recomp/portable_build.py', 'scripts/recomp/windows_support.py') }}
      - name: Build the Vulkan bundle with shaderc
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          $env:PYTHONPATH = "$PWD"
          $cc = "$PWD\work\toolchain\bin\x86_64-w64-mingw32-clang.exe"
          python scripts/recomp/dependency_build.py vulkan --archives work/downloads --cc $cc --cmake (Get-Command cmake).Source --ninja (Get-Command ninja).Source --prefix work/tools/vulkan
      - name: Reuse hactool while its revision, recipe and compiler are unchanged
        id: hactool-cache
        uses: actions/cache@v6
        with:
          path: work/tools/hactool
          key: hactool-${{ hashFiles('work/key-hactool.txt', 'scripts/recomp/dependency_build.py', 'scripts/recomp/portable_build.py', 'scripts/recomp/windows_support.py', 'scripts/recomp/hactool_windows.c', 'scripts/recomp/hactool_windows.h') }}
      - name: Build hactool
        if: steps.hactool-cache.outputs.cache-hit != 'true'
        run: |
          $env:PYTHONPATH = "$PWD"
          $cc = "$PWD\work\toolchain\bin\x86_64-w64-mingw32-clang.exe"
          python scripts/recomp/dependency_build.py hactool --archives work/downloads --cc $cc --prefix work/tools/hactool
      - name: Reuse the code generator while its sources and Unicorn are unchanged
        id: generator-cache
        uses: actions/cache@v6
        with:
          path: work/tools/generator
          key: generator-${{ hashFiles('work/key-unicorn.txt', 'scripts/recomp/native-generator/**', 'scripts/recomp/portable_build.py', 'scripts/recomp/windows_support.py') }}
      - name: Build the code generator
        if: steps.generator-cache.outputs.cache-hit != 'true'
        run: |
          $env:PYTHONPATH = "$PWD"
          $cc = "$PWD\work\toolchain\bin\x86_64-w64-mingw32-clang.exe"
          python scripts/recomp/portable_build.py generator --cc $cc --host-cc $cc --unicorn-root work/unicorn
          Copy-Item work/native-generator/windows-x86_64 work/tools/generator -Recurse
      - name: Licence texts, notices and the resolved inputs for the archive
        run: |
          $env:PYTHONPATH = "$PWD"
          python scripts/recomp/dependency_build.py qt-notices --qt-source work/downloads/qtbase-src.tar.xz --prefix work/tools/license-texts/qt
          python scripts/recomp/dependency_build.py ffmpeg-license-texts --archives work/downloads --prefix work/tools/license-texts/ffmpeg
          python scripts/recomp/archive_notices.py --resolved work/resolved --out work/tools/NOTICES
          New-Item -ItemType Directory -Force work/tools/inputs | Out-Null
          Copy-Item work/resolved/*.json work/tools/inputs
      - name: Vulkan loader and the unpack/extract tool
        run: |
          # The renderer links the Vulkan loader statically; runners have no GPU driver, so install LunarG's loader (latest).
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime.exe -OutFile vulkan-runtime.exe -UseBasicParsing
          Start-Process ./vulkan-runtime.exe -ArgumentList '/S' -Wait
          if (-not (Test-Path C:\Windows\System32\vulkan-1.dll)) { throw "Vulkan loader was not installed" }
          cargo build --release --manifest-path installer/extract/Cargo.toml
          Add-Content $env:GITHUB_ENV "BDSP_EXTRACT=$PWD\installer\extract\target\release\bdsp-extract.exe"
      - name: Set up the build environment exactly like a user's machine does (Qt, FFmpeg and SDL3 from their publishers)
        run: |
          $env:PYTHONPATH = "$PWD"
          python scripts/install/windows_setup.py --tools work/tools --out work/env
      - name: Windows tests against the new environment
        run: |
          $dir = "$PWD\work\env"
          Remove-Item Env:BDSP_WINDOWS_CONTRACT, Env:BDSP_WINDOWS_SOURCES  # the contract tests check the repository files
          $env:PYTHONPATH = "$PWD;$PWD\work\pydeps"
          $env:BDSP_WINDOWS_NATIVE_CC = "$dir\toolchain\bin\x86_64-w64-mingw32-clang.exe"
          $env:CC = $env:BDSP_WINDOWS_NATIVE_CC
          $env:BDSP_WINDOWS_NATIVE_BINARY = "$dir\generator\bdsp_codegen.exe"
          $env:BDSP_WINDOWS_PRIVATE_CATALOG = "$dir\catalog.json"
          $env:BDSP_WINDOWS_SDL_ROOT = "$dir\sdl"
          $env:BDSP_WINDOWS_VULKAN_ROOT = "$dir\vulkan"
          $env:BDSP_WINDOWS_FFMPEG_ROOT = "$dir\ffmpeg"
          $env:BDSP_WINDOWS_HACTOOL_ROOT = "$dir\hactool"
          $env:BDSP_WINDOWS_QT_ROOT = "$dir\qt"
          python scripts/tests/run_parallel.py scripts.tests.test_windows_build scripts.tests.test_windows_pipeline scripts.tests.test_windows_native_generator scripts.tests.test_dependency_build scripts.tests.test_installer_filesystem scripts.tests.test_installer_driver
      - name: Pack the tools
        run: |
          python -c "import shutil; shutil.make_archive('work/windows-components', 'zip', 'work/tools')"
          $file = Get-Item work/windows-components.zip
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $meta = [ordered]@{ schema = 1; archive = 'windows-components.zip'; sha256 = $hash; size_bytes = $file.Length; created = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'); commit = $env:GITHUB_SHA }
          $meta | ConvertTo-Json | Set-Content work/windows-components.json
          Get-Content work/windows-components.json | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Generate the SBOM
        run: |
          cargo fetch --locked --manifest-path installer/Cargo.toml && cargo fetch --locked --manifest-path installer/extract/Cargo.toml
          python scripts/sbom/generate_sbom.py --out work/sbom --windows-inputs work/resolved
      - uses: actions/upload-artifact@v7
        with:
          name: windows-components
          path: |
            work/windows-components.zip
            work/windows-components.json
            work/sbom/strahlender-xnu.*
          if-no-files-found: error
          retention-days: 14
      - name: Publish as the release "windows-components"
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          gh release view windows-components *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows-components --title "Windows components" --notes "Rolling build environment for the Windows game build, rebuilt weekly from the newest upstream releases. The installer downloads it; versions and hashes are in inputs/ and windows-components.json." }
          gh release upload windows-components work/windows-components.zip work/windows-components.json work/resolved/windows-dependencies.json work/resolved/windows-sources.json work/resolved/qt.json (Get-ChildItem work/sbom/strahlender-xnu.*).FullName --clobber
