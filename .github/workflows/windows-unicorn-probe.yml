name: Windows Unicorn probe
run-name: Unicorn from source with LLVM-MinGW · ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unicorn:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Qt's LLVM-MinGW
        run: |
          python scripts/recomp/resolve_qt.py --out work/qt-download
          7z x work/qt-download/toolchain.7z -owork/qt-tools -y | Out-Null
          $clang = Get-ChildItem work/qt-tools -Recurse -Filter x86_64-w64-mingw32-clang.exe | Select-Object -First 1
          Move-Item $clang.Directory.Parent.FullName work/toolchain
          & work/toolchain/bin/x86_64-w64-mingw32-clang.exe --version
      - name: Build Unicorn 2.1.4
        run: |
          Invoke-WebRequest https://github.com/unicorn-engine/unicorn/archive/refs/tags/2.1.4.tar.gz -OutFile unicorn.tar.gz -UseBasicParsing
          tar xzf unicorn.tar.gz
          $bin = "$PWD\work\toolchain\bin"
          $env:PATH = "$bin;$env:PATH"
          cmake -S unicorn-2.1.4 -B work/unicorn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$bin\x86_64-w64-mingw32-clang.exe" -DCMAKE_CXX_COMPILER="$bin\x86_64-w64-mingw32-clang++.exe" -DCMAKE_RC_COMPILER="$bin\x86_64-w64-mingw32-windres.exe" -DBUILD_SHARED_LIBS=ON -DUNICORN_ARCH=aarch64 -DUNICORN_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD\work\unicorn"
          cmake --build work/unicorn-build --parallel
          cmake --install work/unicorn-build
          Get-ChildItem work/unicorn -Recurse -File | Select-Object -First 30 FullName, Length
      - name: Which DLLs does it need?
        run: |
          $env:PYTHONPATH = "$PWD"
          python -c "import glob; from scripts.recomp import windows_support as w; [print(f, sorted(w.PE(f).imports())) for f in glob.glob('work/unicorn/**/*.dll', recursive=True)]"
